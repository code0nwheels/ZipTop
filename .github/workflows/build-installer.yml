name: Build Windows installer

# - Every merge to main builds a test installer, versioned as the next
#   patch with -dev.<run> (e.g. 1.2.4-dev.57), attached to the run.
# - Pushing a tag v1.2.3, or running this by hand on main with a version
#   typed in, builds 1.2.3 and publishes it as a GitHub Release with the
#   installer attached. Installed copies of ZipTop offer it as an update.
on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 1.2.0. Leave empty for a test build.'
        required: false
        default: ''

permissions:
  # Publishing a release creates its tag.
  contents: write

concurrency:
  group: installer-${{ github.ref }}
  # A newer merge makes an older test build pointless; a release always finishes.
  cancel-in-progress: ${{ github.ref_type == 'branch' && github.event_name == 'push' }}

jobs:
  installer:
    name: Test and package
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Tags are needed to number test builds after the latest release.
          fetch-depth: 0

      - name: Work out the version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: >
          ./tool/resolve_version.ps1
          -RefType '${{ github.ref_type }}'
          -RefName '${{ github.ref_name }}'
          -InputVersion "$env:INPUT_VERSION"
          -RunNumber ${{ github.run_number }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep in step with the version used for local builds.
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      # windows/CMakeLists.txt downloads a pinned libmpv (~32 MB) into
      # windows/third_party when it is missing; keep it between runs.
      - name: Cache libmpv
        uses: actions/cache@v4
        with:
          path: windows/third_party/libmpv
          key: libmpv-${{ hashFiles('windows/CMakeLists.txt') }}

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (Test-Path $iscc) {
            Write-Host "Inno Setup already installed"
          } else {
            choco install innosetup --yes --no-progress
          }

      - name: Build release and installer
        shell: pwsh
        run: >
          ./tool/build_installer.ps1
          -Version '${{ steps.version.outputs.version }}'
          -BuildNumber ${{ steps.version.outputs.build_number }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ZipTop-Setup-${{ steps.version.outputs.version }}
          path: installer/output/ZipTop-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "v$env:VERSION"
          $setup = "installer/output/ZipTop-Setup-$env:VERSION.exe"
          # For a pushed tag the tag exists; for a manual run this creates it
          # at the commit that was built.
          gh release create $tag $setup `
            --title "ZipTop $env:VERSION" `
            --target $env:GITHUB_SHA `
            --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the release failed.' }
