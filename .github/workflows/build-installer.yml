name: Build and release

# - Every merge to main is released: the latest v* tag plus a patch bump
#   (v1.2.3 -> 1.2.4), or a minor or major one when the merged pull request
#   is labelled release:minor or release:major. The Windows installer, the
#   Linux AppImage and the macOS DMG are published as GitHub Release v1.2.4,
#   which also creates the tag. Installed copies of ZipTop offer it as an
#   update.
# - A pull request labelled release:skip (docs, CI) only makes test builds,
#   versioned as the next patch with -dev.<run> (e.g. 1.2.4-dev.57) and
#   attached to the run.
# - Pushing a tag v1.2.3, or running this by hand on main with a version
#   typed in, releases exactly 1.2.3.
on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 1.2.0. Leave empty for a test build.'
        required: false
        default: ''

permissions:
  # Publishing a release creates its tag. (A tag made with this workflow's
  # token does not start the workflow again.)
  contents: write
  # Reading the merged pull request's labels.
  pull-requests: read

# One build at a time, never cancelled: each one may be a release, and the
# next version is worked out from the tags the previous one made. If several
# merges queue up, GitHub keeps only the newest waiting run, which includes
# the others' changes.
concurrency:
  group: build-and-release
  cancel-in-progress: false

env:
  # Keep in step with the version used for local builds.
  FLUTTER_VERSION: '3.47.9'

jobs:
  version:
    name: Work out the version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # Tags are needed to number builds after the latest release.
          fetch-depth: 0

      # A push to main is a merged pull request (or a direct push, which has
      # no labels and so gets a patch release).
      - name: Read the release label
        id: bump
        if: github.event_name == 'push' && github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].labels[].name' || true)"
          case "$labels" in
            *release:skip*) bump=none ;;
            *release:major*) bump=major ;;
            *release:minor*) bump=minor ;;
            *) bump=patch ;;
          esac
          echo "Labels: ${labels:-none}; bump: $bump"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Work out the version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          BUMP: ${{ steps.bump.outputs.bump || 'none' }}
        run: >
          ./tool/resolve_version.ps1
          -RefType '${{ github.ref_type }}'
          -RefName '${{ github.ref_name }}'
          -InputVersion "$env:INPUT_VERSION"
          -RunNumber ${{ github.run_number }}
          -Bump "$env:BUMP"

  windows:
    name: Windows installer
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # windows/CMakeLists.txt downloads a pinned libmpv (~32 MB) into
      # windows/third_party when it is missing; keep it between runs.
      - name: Cache libmpv
        uses: actions/cache@v6
        with:
          path: windows/third_party/libmpv
          key: libmpv-${{ hashFiles('windows/CMakeLists.txt') }}

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (Test-Path $iscc) {
            Write-Host "Inno Setup already installed"
          } else {
            choco install innosetup --yes --no-progress
          }

      - name: Build release and installer
        shell: pwsh
        run: >
          ./tool/build_installer.ps1
          -Version '${{ needs.version.outputs.version }}'
          -BuildNumber ${{ needs.version.outputs.build_number }}

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ZipTop-Setup-${{ needs.version.outputs.version }}
          path: installer/output/ZipTop-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux AppImage
    needs: version
    # The oldest supported glibc (2.35): the AppImage runs on this and newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config patchelf file \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libepoxy-dev \
            libsecret-1-dev libayatana-appindicator3-dev libjsoncpp-dev \
            nasm python3-venv hwdata \
            libfreetype-dev libfribidi-dev libharfbuzz-dev libfontconfig-dev \
            libva-dev libdrm-dev libpulse-dev libasound2-dev \
            libegl-dev libgl-dev libx11-dev libxext-dev libxpresent-dev \
            libxrandr-dev libxss-dev libxkbcommon-dev libxv-dev \
            zlib1g-dev libssl-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # linux/third_party/build_libmpv.sh builds libmpv 0.42 and FFmpeg from
      # pinned sources (several minutes); keep the result between runs.
      - name: Cache libmpv
        uses: actions/cache@v6
        with:
          path: |
            linux/third_party/libmpv
            !linux/third_party/libmpv/src
          key: libmpv-linux-${{ hashFiles('linux/third_party/build_libmpv.sh') }}

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release and AppImage
        run: >
          ./tool/build_appimage.sh
          --version '${{ needs.version.outputs.version }}'
          --build-number ${{ needs.version.outputs.build_number }}

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: ZipTop-${{ needs.version.outputs.version }}-x86_64.AppImage
          path: build/appimage/ZipTop-*-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS DMG
    needs: version
    # Apple Silicon. The DMG is arm64 only and needs macOS 13 or later.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Build tools only; macos/third_party/build_libmpv.sh builds every
      # library the app ships from pinned sources.
      - name: Install build tools
        run: brew install pkgconf

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # macos/third_party/build_libmpv.sh builds libmpv 0.42 and FFmpeg from
      # pinned sources (several minutes); keep the result between runs. It
      # is saved even when the build fails: the script marks each finished
      # library, so the next run carries on from the one that failed.
      - name: Restore libmpv
        id: libmpv-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            macos/third_party/libmpv
            !macos/third_party/libmpv/src
          key: libmpv-macos-${{ hashFiles('macos/third_party/build_libmpv.sh') }}-${{ github.run_id }}
          # Only builds made by this exact script: its marks name versions,
          # not options, so an older script's half-built libraries must not
          # be picked up.
          restore-keys: |
            libmpv-macos-${{ hashFiles('macos/third_party/build_libmpv.sh') }}-

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Every build is signed with the same self-signed certificate (made
      # with tool/make_macos_signing_cert.sh), so the login keychain knows an
      # update as the ZipTop it already allowed and doesn't ask again for the
      # pairing token. An ad-hoc signature changes with every build.
      - name: Load the signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          RELEASE: ${{ needs.version.outputs.release }}
        run: |
          if [ -z "$CERT_P12" ] || [ -z "$CERT_PASSWORD" ]; then
            if [ "$RELEASE" = 'true' ]; then
              echo "::error::MACOS_SIGNING_CERT_P12 and MACOS_SIGNING_CERT_PASSWORD are not set. A release signed ad hoc would make every Mac ask for the keychain again; see tool/make_macos_signing_cert.sh." >&2
              exit 1
            fi
            echo "::warning::No signing certificate in this run's secrets; this test build is signed ad hoc."
            exit 0
          fi
          dir="$RUNNER_TEMP/signing"
          mkdir -p "$dir"
          printf '%s' "$CERT_P12" | base64 --decode > "$dir/cert.p12"
          keychain="$dir/ziptop-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$dir/cert.p12" -k "$keychain" -f pkcs12 -P "$CERT_PASSWORD" -T /usr/bin/codesign
          # Let codesign use the key without a prompt nobody could answer.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          # codesign looks identities up through the search list.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          openssl pkcs12 -in "$dir/cert.p12" -nokeys -passin env:CERT_PASSWORD | openssl x509 > "$dir/cert.pem"
          sha1="$(openssl x509 -in "$dir/cert.pem" -noout -fingerprint -sha1 | sed 's/.*=//; s/://g')"
          # A self-signed certificate isn't trusted, which signing by its hash
          # doesn't need; trusting it on this throwaway runner as well keeps
          # codesign from turning it down.
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$dir/cert.pem" \
            || echo "::warning::Couldn't mark the signing certificate as trusted on the runner."
          rm -f "$dir/cert.p12"
          echo "Signing certificate $sha1"
          security find-identity -p codesigning "$keychain"
          {
            echo "MACOS_SIGN_IDENTITY=$sha1"
            echo "MACOS_SIGN_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"

      - name: Build release and DMG
        run: >
          ./tool/build_dmg.sh
          --version '${{ needs.version.outputs.version }}'
          --build-number ${{ needs.version.outputs.build_number }}

      - name: Save libmpv
        if: always() && steps.libmpv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            macos/third_party/libmpv
            !macos/third_party/libmpv/src
          key: libmpv-macos-${{ hashFiles('macos/third_party/build_libmpv.sh') }}-${{ github.run_id }}

      # Nobody can watch a channel play here, so check what can be checked:
      # the bundled libmpv loads on its own and is new enough for DASH...
      - name: Probe the bundled libmpv
        run: dart run tool/mpv_probe.dart build/macos/Build/Products/Release/ZipTop.app/Contents/Frameworks/Mpv.framework/Mpv

      # ...and the app starts from the DMG and stays up (it loads libmpv at
      # start-up). The screenshot shows what it drew.
      - name: Launch from the DMG
        run: |
          mkdir -p smoke
          dmg="build/dmg/ZipTop-${{ needs.version.outputs.version }}-macos-arm64.dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/ziptop-dmg" "$dmg"
          "$RUNNER_TEMP/ziptop-dmg/ZipTop.app/Contents/MacOS/ZipTop" > smoke/ziptop.log 2>&1 &
          pid=$!
          sleep 20
          screencapture -x smoke/screen.png || true
          if ! kill -0 "$pid" 2>/dev/null; then
            wait "$pid" || echo "ZipTop exited with status $?"
            cat smoke/ziptop.log
            exit 1
          fi
          echo "ZipTop ran for 20 s."
          # Quit it the way the Dock or Cmd+Q does (an Apple Event, through
          # applicationShouldTerminate), not with kill. It is on the pairing
          # screen, where a quit was once swallowed and ZipTop had to be
          # force quit.
          # ZipTop always turns down the first request (so Dart can shut down
          # first) and then quits by itself, which AppleScript reports as
          # "User canceled" (-128): the event was delivered.
          sent=0
          if osascript -e 'tell application id "com.zipstreams.ziptop" to quit' > smoke/quit.log 2>&1; then
            sent=1
          elif grep -q '(-128)' smoke/quit.log; then
            sent=1
          fi
          if [ "$sent" = 1 ]; then
            for _ in $(seq 20); do
              kill -0 "$pid" 2>/dev/null || break
              sleep 0.5
            done
            if kill -0 "$pid" 2>/dev/null; then
              echo "ZipTop was asked to quit and is still running 10 s later." >&2
              kill -9 "$pid"
              exit 1
            fi
            echo "ZipTop quit when asked."
          else
            # The runner may not allow sending Apple Events; say so rather
            # than fail on something that isn't ZipTop's.
            echo "::warning::Couldn't send ZipTop a quit event: $(cat smoke/quit.log)"
            kill "$pid"
          fi
          wait "$pid" || true
          hdiutil detach "$RUNNER_TEMP/ziptop-dmg"

      - name: Upload launch screenshot and log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-smoke-test
          path: smoke/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: ZipTop-${{ needs.version.outputs.version }}-macos-arm64.dmg
          path: build/dmg/ZipTop-*-macos-arm64.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Remove the signing keychain
        if: always() && env.MACOS_SIGN_KEYCHAIN != ''
        run: security delete-keychain "$MACOS_SIGN_KEYCHAIN" || true

  release:
    name: Publish release
    needs: [version, windows, linux, macos]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # For a pushed tag the tag exists; for a manual run this creates it
          # at the commit that was built.
          gh release create "v$VERSION" \
            "dist/ZipTop-Setup-$VERSION.exe" \
            "dist/ZipTop-$VERSION-x86_64.AppImage"             "dist/ZipTop-$VERSION-macos-arm64.dmg" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ZipTop $VERSION" \
            --target "$GITHUB_SHA" \
            --generate-notes
